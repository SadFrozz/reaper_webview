name: Build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build release and debug libraries
        run: cmake --build --preset windows-x64 --config Release --target reaper_webview reaper_webview_debug --parallel

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($text, 'project\(reaper_webview VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw 'Project version was not found' }
          "value=$($match.Groups[1].Value)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package Windows libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage, packages -Force | Out-Null
          Copy-Item -LiteralPath "build/Release/reaper_webview.dll" -Destination "stage/reaper_webview.dll"
          Copy-Item -LiteralPath "build/Release/reaper_webview_debug.dll" -Destination "stage/reaper_webview_debug.dll"
          Copy-Item -LiteralPath "deps/webview2-sdk/build/native/x64/WebView2Loader.dll" -Destination "stage/WebView2Loader.dll"
          Copy-Item -LiteralPath "README.md" -Destination "stage/README.md"
          Copy-Item -LiteralPath "LICENSE" -Destination "stage/LICENSE"

          $checksumLines = foreach ($file in Get-ChildItem -LiteralPath stage -File) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksumLines | Set-Content -LiteralPath "stage/SHA256SUMS.txt" -Encoding ascii

          $archive = "packages/Reaper-WebView-${{ steps.version.outputs.value }}-windows-x64.zip"
          Compress-Archive -Path "stage/*" -DestinationPath $archive

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: reaper-webview-windows-x64
          path: packages/*.zip
          if-no-files-found: error

  macos:
    name: macOS Universal
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset macos-universal

      - name: Build release and debug libraries
        run: cmake --build --preset macos-universal --target reaper_webview reaper_webview_debug --parallel

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^project\(reaper_webview VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package macOS libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage packages
          cp build/reaper_webview.dylib stage/reaper_webview.dylib
          cp build/reaper_webview_debug.dylib stage/reaper_webview_debug.dylib
          lipo stage/reaper_webview.dylib -verify_arch x86_64 arm64
          lipo stage/reaper_webview_debug.dylib -verify_arch x86_64 arm64
          codesign --force --sign - stage/reaper_webview.dylib
          codesign --force --sign - stage/reaper_webview_debug.dylib
          codesign --verify --strict stage/reaper_webview.dylib
          codesign --verify --strict stage/reaper_webview_debug.dylib
          cp README.md LICENSE stage/
          (cd stage && shasum -a 256 reaper_webview.dylib reaper_webview_debug.dylib README.md LICENSE > SHA256SUMS.txt)
          ditto -c -k --sequesterRsrc stage \
            "packages/Reaper-WebView-${{ steps.version.outputs.value }}-macos-universal.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: reaper-webview-macos-universal
          path: packages/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version="$(sed -nE 's/^project\(reaper_webview VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          tag_version="${GITHUB_REF_NAME#v}"
          tag_base="${tag_version%%-*}"
          test -n "$project_version"
          if [[ "$tag_base" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi

      - name: Build release notes from changelog
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > changelog-section.md

          if [[ ! -s changelog-section.md ]]; then
            echo "Changelog section for $GITHUB_REF_NAME is missing or empty" >&2
            exit 1
          fi

          {
            echo "# Reaper WebView Extension $GITHUB_REF_NAME"
            echo
            cat changelog-section.md
            echo
            echo "## Installation"
            echo
            echo "Download the archive for your platform and copy its contents to the REAPER UserPlugins directory."
          } > release-notes.md

          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]] || \
             grep -Eq "^## ${GITHUB_REF_NAME}[[:space:]]+(Alpha|Beta|RC)([[:space:]]|$)" CHANGELOG.md; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: reaper-webview-windows-x64
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: reaper-webview-macos-universal
          path: release-assets

      - name: Create release checksums
        shell: bash
        run: (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then prerelease_args=(--prerelease); fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Reaper WebView $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "Reaper WebView $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
